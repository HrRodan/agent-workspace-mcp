[project]
name = "agent-workspace-mcp"
version = "1.2.0"
description = "A sandboxed, agentic workspace MCP server for LLMs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.2.3",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project.scripts]
agent-workspace-mcp = "agent_workspace_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "litellm>=1.50",
    "ipykernel>=7.2.0",
    "ipython>=9.12.0",
    "openai-agents>=0.13.6",
    "hatchling>=1.29.0",
    "ruff>=0.9",
    "python-dotenv>=1.0",
    "pytest-xdist>=3.8.0",
]

[tool.pyrefly]
project-includes = ["**/*.py","**/*.ipynb"]
project-excludes = ["**/node_modules", "**/__pycache__", "**/*venv/**", "**/.gemini/**", "**/.venv/**", "**/*[!/.]*/**"]
use-ignore-files = true
search-path = ["."]
ignore-path = ["tmp/**"]

[tool.ruff]

exclude = [
    "tmp"
]

[tool.pytest.ini_options]
addopts = "-n 3 --ignore=tests/integration"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
