[project]
name = "agent-workspace-mcp"
version = "1.3.0"
description = "A sandboxed, agentic workspace MCP server for LLMs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp==3.2.4",
    "pydantic==2.13.3",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project.scripts]
agent-workspace-mcp = "agent_workspace_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ipykernel==7.2.0",
    "ipython==9.13.0",
    "openai-agents==0.14.6",
    "hatchling==1.29.0",
    "ruff==0.15.12",
    "python-dotenv==1.2.2",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
]

[tool.pyrefly]
project-includes = ["**/*.py","**/*.ipynb"]
project-excludes = ["**/node_modules", "**/__pycache__", "**/*venv/**", "**/.gemini/**", "**/.venv/**", "**/*[!/.]*/**","**/tmp/**","**/__pyrefly_virtual__/**"]
use-ignore-files = true
search-path = ["."]

[tool.ruff]

exclude = [
    "tmp"
]

[tool.pytest.ini_options]
addopts = "-n 3 --ignore=tests/integration --ignore=tests/container"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["agent_workspace_mcp"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
