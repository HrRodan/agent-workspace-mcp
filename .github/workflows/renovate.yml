name: Renovate

on:
  workflow_dispatch:
  schedule:
    # 03:00 every Sunday
    - cron: '0 3 * * 0'

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v41.0.12
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_MODELS: "uv"
          LOG_LEVEL: info
