name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # schedule:
  #   - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC ##
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          load: true
          tags: agent-workspace-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker smoke test
        run: |
          echo '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"capabilities":{},"protocolVersion":"2024-11-05","clientInfo":{"name":"ci","version":"0.1.0"}}}' \
          | timeout 10 docker run -i --rm \
            --read-only \
            --tmpfs /tmp \
            --cap-drop=ALL \
            agent-workspace-mcp \
          | head -1 | grep '"jsonrpc":"2.0"'

  docker-publish:
    # Use pyproject.toml as the source of truth for versions. 
    # This job triggers only on push to main, manual dispatch, and schedule (tagless flow).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      packages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # Fetch all history for commit counting logic

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          enable-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Lowercase Repository Name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Compute ephemeral version from Git history
        id: get_version
        run: |
          # 1. Extract the manual MAJOR.MINOR from pyproject.toml (e.g., "1.1")
          BASE_VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2 | cut -d. -f1,2)
          MAJOR_VERSION=$(echo "$BASE_VERSION" | cut -d. -f1)
          
          # 2. Find the last commit that modified the version line in pyproject.toml
          LAST_VERSION_COMMIT=$(git log -1 --format=%H -S "version =" pyproject.toml)
          
          # 3. Count commits since that change (0 for the commit where it changed)
          PATCH_COUNT=$(git rev-list --count $LAST_VERSION_COMMIT..HEAD)
          
          # 4. Construct the full ephemeral version (e.g., "1.1.5")
          FULL_VERSION="${BASE_VERSION}.${PATCH_COUNT}"
          
          # 5. Extract Python version from uv environment
          PYTHON_FULL_VERSION=$(uv run python --version | cut -d' ' -f2)
          PYTHON_VERSION=$(echo "$PYTHON_FULL_VERSION" | cut -d. -f1,2)
          
          echo "Computed version: $FULL_VERSION (Base: $BASE_VERSION, Patch: $PATCH_COUNT)"
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "major_version=$MAJOR_VERSION" >> $GITHUB_OUTPUT
          echo "python_version=python-$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "python_full_version=python-$PYTHON_FULL_VERSION" >> $GITHUB_OUTPUT
          
          # 6. Patch pyproject.toml locally in CI so the Docker build metadata is correct.
          # This change is NOT committed back to the repo.
          sed -i "s/^version = .*/version = \"$FULL_VERSION\"/" pyproject.toml
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            # Tag image with the explicit version from pyproject.toml
            type=raw,value=${{ steps.get_version.outputs.version }}
            # Tag with mutable floating major/minor versions
            type=raw,value=${{ steps.get_version.outputs.base_version }}
            type=raw,value=${{ steps.get_version.outputs.major_version }}
            # Tag with Python version
            type=raw,value=${{ steps.get_version.outputs.python_version }}
            type=raw,value=${{ steps.get_version.outputs.python_full_version }}
            # Also maintain a 'latest' tag for convenience
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Sync server.json version
        run: |
          # Dynamically patch server.json before publishing to registry.
          # This ensures the OCI identifier correctly matches the image we just built.
          VERSION=${{ steps.get_version.outputs.version }}
          REPO_NAME=${{ steps.repo.outputs.name }}
          jq --arg v "$VERSION" --arg r "ghcr.io/$REPO_NAME:$VERSION" \
            '.version = $v | .packages[0].identifier = $r' server.json > server.tmp && mv server.tmp server.json
      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish to MCP Registry only on push to main
      - name: Install mcp-publisher
        if: github.event_name == 'push'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        if: github.event_name == 'push'
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        if: github.event_name == 'push'
        run: ./mcp-publisher publish
