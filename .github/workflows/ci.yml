name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # schedule:
  #   - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC ##
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository source code
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Set up the uv package manager with caching enabled
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      # Run unit tests using pytest, ignoring integration and container tests, with coverage
      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration/ --ignore=tests/container/ -v --cov=agent_workspace_mcp --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # Helper variable to determine if we are running on the main branch (excluding PRs)
      IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      # Check out the repository with full history for version calculation
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ env.IS_MAIN == 'true' && '0' || '1' }}

      # Dynamically compute versions based on pyproject.toml and git history
      - name: Compute version metadata
        id: calc
        run: |
          if [[ "$IS_MAIN" == "true" ]]; then
            # 1. Extract the manual MAJOR.MINOR from pyproject.toml
            BASE_VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2 | cut -d. -f1,2)
            MAJOR_VERSION=$(echo "$BASE_VERSION" | cut -d. -f1)
            
            # 2. Find last version change
            LAST_VERSION_COMMIT=$(git log -1 --format=%H -G "^version = " -- pyproject.toml || git rev-list --max-parents=0 HEAD)
            
            # 3. Count commits since that change
            PATCH_COUNT=$(git rev-list --count $LAST_VERSION_COMMIT..HEAD)
            FULL_VERSION="${BASE_VERSION}.${PATCH_COUNT}"
          else
            # PR builds: version metadata is not pushed, use placeholder
            FULL_VERSION="0.0.0-pr"
            BASE_VERSION="0.0"
            MAJOR_VERSION="0"
          fi
          
          # 4. Extract Python version from Dockerfile (robustly)
          PYTHON_FULL_VERSION=$(sed -n 's/.*python:\([0-9.]*\).*/\1/p' Dockerfile | head -n 1)
          PYTHON_VERSION=$(echo "$PYTHON_FULL_VERSION" | cut -d. -f1,2)
          
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "major_version=$MAJOR_VERSION" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "python_version=python-$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "python_full_version=python-$PYTHON_FULL_VERSION" >> $GITHUB_OUTPUT

      # Prepare Docker Buildx for building the image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      # Log in to GitHub Container Registry (only on main)
      - name: Log in to GHCR
        if: env.IS_MAIN == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ensure the repository name is lowercase for Docker registry compatibility
      - name: Lowercase Repository Name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Generate Docker tags and labels (only on main)
      - name: Extract metadata (tags, labels) for Docker
        if: env.IS_MAIN == 'true'
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=${{ steps.calc.outputs.version }}
            type=raw,value=${{ steps.calc.outputs.base_version }}
            type=raw,value=${{ steps.calc.outputs.major_version }}
            type=raw,value=${{ steps.calc.outputs.python_version }}
            type=raw,value=${{ steps.calc.outputs.python_full_version }}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the Docker image and load it into the local daemon for testing
      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          load: true
          tags: agent-workspace-mcp:latest
          build-args: |
            VERSION=${{ steps.calc.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.calc.outputs.created }}
          cache-from: |
            type=gha,scope=docker-${{ github.ref_name }}
            type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-${{ github.ref_name }}

      # Set up the uv package manager for container tests
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      # Run container tests using the locally built image
      - name: Run container tests
        run: uv run pytest tests/container/ -v --timeout=120

      # Verify the image starts and responds to a JSON-RPC initialize request
      - name: Docker smoke test
        run: |
          echo '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"capabilities":{},"protocolVersion":"2024-11-05","clientInfo":{"name":"ci","version":"0.1.0"}}}' \
          | timeout 10 docker run --init -i --rm \
            --read-only \
            --tmpfs /tmp \
            --cap-drop=ALL \
            agent-workspace-mcp:latest \
          | head -1 | grep '"jsonrpc":"2.0"'

      # Push all registry tags in a single operation (only on main)
      - name: Push Docker image
        if: env.IS_MAIN == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.calc.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.calc.outputs.created }}
          cache-from: |
            type=gha,scope=docker-${{ github.ref_name }}
            type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-${{ github.ref_name }}

      # Update server.json with the new version and image identifier (only on main)
      - name: Sync server.json version
        if: env.IS_MAIN == 'true'
        run: |
          VERSION=${{ steps.calc.outputs.version }}
          REPO_NAME=${{ steps.repo.outputs.name }}
          jq --arg v "$VERSION" --arg r "ghcr.io/$REPO_NAME:$VERSION" \
            '.version = $v | .packages[0].identifier = $r' server.json > server.tmp && mv server.tmp server.json

      # Install the mcp-publisher tool for registry updates
      - name: Install mcp-publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # Authenticate to the MCP Registry using OIDC
      - name: Authenticate to MCP Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./mcp-publisher login github-oidc

      # Publish the updated server definition to the MCP Registry
      - name: Publish server to MCP Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./mcp-publisher publish
