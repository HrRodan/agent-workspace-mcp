name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # schedule:
  #   - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC ##
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      base_version: ${{ steps.calc.outputs.base_version }}
      major_version: ${{ steps.calc.outputs.major_version }}
      created: ${{ steps.calc.outputs.created }}
      python_version: ${{ steps.calc.outputs.python_version }}
      python_full_version: ${{ steps.calc.outputs.python_full_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          enable-cache: true
      - id: calc
        run: |
          # 1. Extract the manual MAJOR.MINOR from pyproject.toml
          BASE_VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2 | cut -d. -f1,2)
          MAJOR_VERSION=$(echo "$BASE_VERSION" | cut -d. -f1)
          
          # 2. Find last version change
          LAST_VERSION_COMMIT=$(git log -1 --format=%H -G "^version = " -- pyproject.toml || git rev-list --max-parents=0 HEAD)
          
          # 3. Count commits since that change
          PATCH_COUNT=$(git rev-list --count $LAST_VERSION_COMMIT..HEAD)
          FULL_VERSION="${BASE_VERSION}.${PATCH_COUNT}"
          
          # 4. Extract Python version
          PYTHON_FULL_VERSION=$(uv run python --version | cut -d' ' -f2)
          PYTHON_VERSION=$(echo "$PYTHON_FULL_VERSION" | cut -d. -f1,2)
          
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "major_version=$MAJOR_VERSION" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "python_version=python-$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "python_full_version=python-$PYTHON_FULL_VERSION" >> $GITHUB_OUTPUT

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [unit-tests, metadata]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Patch version in pyproject.toml
        run: sed -i "s/^version = .*/version = \"${{ needs.metadata.outputs.version }}\"/" pyproject.toml
      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          load: true
          tags: agent-workspace-mcp:latest
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker smoke test
        run: |
          echo '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"capabilities":{},"protocolVersion":"2024-11-05","clientInfo":{"name":"ci","version":"0.1.0"}}}' \
          | timeout 10 docker run -i --rm \
            --read-only \
            --tmpfs /tmp \
            --cap-drop=ALL \
            agent-workspace-mcp \
          | head -1 | grep '"jsonrpc":"2.0"'

  docker-publish:
    # This job triggers only on push to main, manual dispatch, and schedule (tagless flow).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [docker-build, metadata]
    permissions:
      packages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Lowercase Repository Name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Patch version in pyproject.toml
        run: sed -i "s/^version = .*/version = \"${{ needs.metadata.outputs.version }}\"/" pyproject.toml
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}
            type=raw,value=${{ needs.metadata.outputs.base_version }}
            type=raw,value=${{ needs.metadata.outputs.major_version }}
            type=raw,value=${{ needs.metadata.outputs.python_version }}
            type=raw,value=${{ needs.metadata.outputs.python_full_version }}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Sync server.json version
        run: |
          VERSION=${{ needs.metadata.outputs.version }}
          REPO_NAME=${{ steps.repo.outputs.name }}
          jq --arg v "$VERSION" --arg r "ghcr.io/$REPO_NAME:$VERSION" \
            '.version = $v | .packages[0].identifier = $r' server.json > server.tmp && mv server.tmp server.json
      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish to MCP Registry only on push to main
      - name: Install mcp-publisher
        if: github.event_name == 'push'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        if: github.event_name == 'push'
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        if: github.event_name == 'push'
        run: ./mcp-publisher publish
